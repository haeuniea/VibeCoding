<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>냉장고 재료 인식</title>
<style>
  body { font-family: sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  #dropzone {
    border: 2px dashed #999; border-radius: 8px; padding: 24px; text-align: center;
    color: #666; cursor: pointer; margin-bottom: 16px;
  }
  #dropzone.drag { border-color: #333; color: #333; }
  #preview { max-width: 100%; max-height: 240px; display: none; margin-bottom: 16px; border-radius: 8px; }
  button { padding: 8px 16px; cursor: pointer; }
  #status { margin: 12px 0; color: #666; }
  #error { margin: 12px 0; color: #c0392b; }
  #ingredients { list-style: none; padding: 0; }
  #ingredients li {
    display: inline-flex; align-items: center; gap: 6px; background: #eee; border-radius: 16px;
    padding: 4px 10px; margin: 4px; font-size: 14px;
  }
  #ingredients li button { border: none; background: none; cursor: pointer; padding: 0; font-size: 14px; }
  #add-ingredient { margin-top: 8px; padding: 6px; width: 100%; box-sizing: border-box; }
  hr { margin: 24px 0; border: none; border-top: 1px solid #ddd; }
  .recipe-card {
    border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 8px; cursor: pointer;
  }
  .recipe-card:hover { background: #f7f7f7; }
  .recipe-card h3 { margin: 0 0 4px 0; font-size: 16px; }
  .recipe-card p { margin: 0; font-size: 13px; color: #666; }
  #recipe-detail { display: none; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-top: 12px; }
  #recipe-detail h3 { margin-top: 0; }
  #recipe-detail .missing { color: #c0392b; font-size: 13px; }
  #back-to-list { margin-bottom: 12px; }
  #auth-section { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin-bottom: 16px; font-size: 14px; }
  #auth-section input { display: block; width: 100%; box-sizing: border-box; margin-bottom: 6px; padding: 6px; }
  #auth-error { color: #c0392b; font-size: 13px; }
  .saved-recipe-item {
    display: flex; justify-content: space-between; align-items: center;
    border: 1px solid #ddd; border-radius: 8px; padding: 8px 12px; margin-bottom: 6px;
  }
  .saved-recipe-item span { cursor: pointer; }
</style>
</head>
<body>
  <div id="auth-section">
    <div id="auth-logged-out">
      <input type="email" id="auth-email" placeholder="이메일">
      <input type="password" id="auth-password" placeholder="비밀번호">
      <button id="signup-btn">회원가입</button>
      <button id="login-btn">로그인</button>
      <div id="auth-error"></div>
    </div>
    <div id="auth-logged-in" style="display:none">
      <span id="auth-current-email"></span>
      <button id="logout-btn">로그아웃</button>
    </div>
  </div>

  <h1>냉장고 사진으로 재료 인식하기</h1>

  <div id="dropzone">사진을 클릭하거나 여기로 드래그하세요</div>
  <input type="file" id="file-input" accept="image/*" style="display:none">
  <img id="preview" alt="미리보기">

  <div>
    <button id="recognize-btn" disabled>재료 인식하기</button>
  </div>

  <div id="status"></div>
  <div id="error"></div>

  <ul id="ingredients"></ul>
  <input type="text" id="add-ingredient" placeholder="재료 직접 추가 후 Enter">

  <hr>

  <h1>레시피 추천</h1>
  <button id="recommend-btn" disabled>레시피 추천받기</button>
  <div id="recipe-status"></div>
  <div id="recipe-error"></div>

  <div id="recipe-list"></div>

  <div id="recipe-detail">
    <button id="back-to-list">← 목록으로</button>
    <h3 id="detail-title"></h3>
    <p><strong>예상 조리 시간:</strong> <span id="detail-time"></span>분</p>
    <p><strong>사용 재료:</strong> <span id="detail-used"></span></p>
    <p class="missing"><strong>추가로 필요한 재료:</strong> <span id="detail-missing"></span></p>
    <ol id="detail-steps"></ol>
    <button id="save-recipe-btn">이 레시피 저장</button>
    <div id="save-status"></div>
  </div>

  <hr>

  <h1>내가 저장한 레시피</h1>
  <div id="saved-recipes-list"></div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const fileInput = document.getElementById('file-input');
    const preview = document.getElementById('preview');
    const recognizeBtn = document.getElementById('recognize-btn');
    const statusEl = document.getElementById('status');
    const errorEl = document.getElementById('error');
    const ingredientsEl = document.getElementById('ingredients');
    const addIngredientInput = document.getElementById('add-ingredient');

    let selectedFile = null;

    dropzone.addEventListener('click', () => fileInput.click());
    dropzone.addEventListener('dragover', (e) => { e.preventDefault(); dropzone.classList.add('drag'); });
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('drag'));
    dropzone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropzone.classList.remove('drag');
      if (e.dataTransfer.files.length > 0) setFile(e.dataTransfer.files[0]);
    });
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length > 0) setFile(fileInput.files[0]);
    });

    function setFile(file) {
      selectedFile = file;
      preview.src = URL.createObjectURL(file);
      preview.style.display = 'block';
      recognizeBtn.disabled = false;
      errorEl.textContent = '';
    }

    function renderIngredients(list) {
      ingredientsEl.innerHTML = '';
      list.forEach((name, idx) => {
        const li = document.createElement('li');
        li.textContent = name + ' ';
        const removeBtn = document.createElement('button');
        removeBtn.textContent = '×';
        removeBtn.onclick = () => {
          list.splice(idx, 1);
          renderIngredients(list);
        };
        li.appendChild(removeBtn);
        ingredientsEl.appendChild(li);
      });
      ingredientsEl.dataset.list = JSON.stringify(list);
      recommendBtn.disabled = list.length === 0;
    }

    let currentIngredients = [];

    addIngredientInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && addIngredientInput.value.trim()) {
        currentIngredients.push(addIngredientInput.value.trim());
        renderIngredients(currentIngredients);
        addIngredientInput.value = '';
      }
    });

    recognizeBtn.addEventListener('click', async () => {
      if (!selectedFile) return;
      errorEl.textContent = '';
      statusEl.textContent = '인식하는 중...';
      recognizeBtn.disabled = true;

      const formData = new FormData();
      formData.append('image', selectedFile);

      try {
        const res = await fetch('/api/recognize-ingredients', { method: 'POST', body: formData });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || '인식에 실패했습니다.');
        }
        currentIngredients = data.ingredients || [];
        if (currentIngredients.length === 0) {
          statusEl.textContent = '재료를 인식하지 못했어요. 다시 시도하거나 직접 입력해주세요.';
        } else {
          statusEl.textContent = '인식 완료. 목록을 확인하고 필요하면 수정하세요.';
        }
        renderIngredients(currentIngredients);
      } catch (err) {
        errorEl.textContent = err.message;
        statusEl.textContent = '';
      } finally {
        recognizeBtn.disabled = false;
      }
    });

    const recommendBtn = document.getElementById('recommend-btn');
    const recipeStatusEl = document.getElementById('recipe-status');
    const recipeErrorEl = document.getElementById('recipe-error');
    const recipeListEl = document.getElementById('recipe-list');
    const recipeDetailEl = document.getElementById('recipe-detail');
    const backToListBtn = document.getElementById('back-to-list');

    let currentRecipes = [];
    let activeRecipe = null;

    function renderRecipeCards(recipes) {
      recipeListEl.innerHTML = '';
      recipeDetailEl.style.display = 'none';
      recipeListEl.style.display = 'block';
      recipes.forEach((recipe) => {
        const card = document.createElement('div');
        card.className = 'recipe-card';
        const summary = recipe.used_ingredients.join(', ') || '재료 정보 없음';
        card.innerHTML = `<h3>${recipe.title}</h3><p>${summary}</p>`;
        card.onclick = () => showRecipeDetail(recipe);
        recipeListEl.appendChild(card);
      });
    }

    function showRecipeDetail(recipe) {
      activeRecipe = recipe;
      document.getElementById('detail-title').textContent = recipe.title;
      document.getElementById('detail-time').textContent = recipe.estimated_time_minutes ?? '?';
      document.getElementById('detail-used').textContent = recipe.used_ingredients.join(', ') || '없음';
      document.getElementById('detail-missing').textContent = recipe.missing_ingredients.join(', ') || '없음';
      const stepsEl = document.getElementById('detail-steps');
      stepsEl.innerHTML = '';
      recipe.steps.forEach((step) => {
        const li = document.createElement('li');
        li.textContent = step;
        stepsEl.appendChild(li);
      });
      document.getElementById('save-status').textContent = '';
      recipeListEl.style.display = 'none';
      recipeDetailEl.style.display = 'block';
    }

    backToListBtn.addEventListener('click', () => {
      recipeDetailEl.style.display = 'none';
      recipeListEl.style.display = 'block';
    });

    recommendBtn.addEventListener('click', async () => {
      if (currentIngredients.length === 0) return;
      recipeErrorEl.textContent = '';
      recipeStatusEl.textContent = '레시피를 만드는 중...';
      recommendBtn.disabled = true;
      recipeListEl.innerHTML = '';
      recipeDetailEl.style.display = 'none';

      try {
        const res = await fetch('/api/recommend-recipes', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ ingredients: currentIngredients }),
        });
        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || '레시피 생성에 실패했어요. 다시 시도해주세요.');
        }
        currentRecipes = data.recipes || [];
        if (currentRecipes.length === 0) {
          recipeStatusEl.textContent = '레시피를 만들지 못했어요. 다시 시도해주세요.';
        } else {
          recipeStatusEl.textContent = `${currentRecipes.length}개의 레시피를 추천받았어요.`;
        }
        renderRecipeCards(currentRecipes);
      } catch (err) {
        recipeErrorEl.textContent = err.message;
        recipeStatusEl.textContent = '';
      } finally {
        recommendBtn.disabled = currentIngredients.length === 0;
      }
    });

    // --- 인증 (3단계) ---
    const authLoggedOutEl = document.getElementById('auth-logged-out');
    const authLoggedInEl = document.getElementById('auth-logged-in');
    const authEmailInput = document.getElementById('auth-email');
    const authPasswordInput = document.getElementById('auth-password');
    const authErrorEl = document.getElementById('auth-error');
    const authCurrentEmailEl = document.getElementById('auth-current-email');
    const savedRecipesListEl = document.getElementById('saved-recipes-list');
    const saveRecipeBtn = document.getElementById('save-recipe-btn');
    const saveStatusEl = document.getElementById('save-status');

    function getToken() {
      try { return localStorage.getItem('token'); } catch { return null; }
    }
    function getStoredEmail() {
      try { return localStorage.getItem('email'); } catch { return null; }
    }
    function setAuth(token, email) {
      try {
        localStorage.setItem('token', token);
        localStorage.setItem('email', email);
      } catch {}
      renderAuthState();
      loadSavedRecipes();
    }
    function clearAuth() {
      try {
        localStorage.removeItem('token');
        localStorage.removeItem('email');
      } catch {}
      renderAuthState();
      savedRecipesListEl.innerHTML = '';
    }

    function renderAuthState() {
      const token = getToken();
      if (token) {
        authLoggedOutEl.style.display = 'none';
        authLoggedInEl.style.display = 'block';
        authCurrentEmailEl.textContent = getStoredEmail() || '';
      } else {
        authLoggedOutEl.style.display = 'block';
        authLoggedInEl.style.display = 'none';
      }
    }

    async function submitAuth(path) {
      authErrorEl.textContent = '';
      const email = authEmailInput.value.trim();
      const password = authPasswordInput.value;
      if (!email || !password) {
        authErrorEl.textContent = '이메일과 비밀번호를 입력해주세요.';
        return;
      }
      try {
        const res = await fetch(path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '요청에 실패했습니다.');
        if (path === '/api/login') {
          setAuth(data.token, data.email);
          authPasswordInput.value = '';
        } else {
          authErrorEl.textContent = '가입 완료! 이제 로그인해주세요.';
        }
      } catch (err) {
        authErrorEl.textContent = err.message;
      }
    }

    document.getElementById('signup-btn').addEventListener('click', () => submitAuth('/api/signup'));
    document.getElementById('login-btn').addEventListener('click', () => submitAuth('/api/login'));
    document.getElementById('logout-btn').addEventListener('click', clearAuth);

    // --- 레시피 저장 (3단계) ---
    saveRecipeBtn.addEventListener('click', async () => {
      if (!activeRecipe) return;
      const token = getToken();
      if (!token) {
        saveStatusEl.textContent = '저장하려면 먼저 로그인해주세요.';
        authEmailInput.scrollIntoView({ behavior: 'smooth' });
        return;
      }
      saveStatusEl.textContent = '저장하는 중...';
      try {
        const res = await fetch('/api/recipes/save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ recipe: activeRecipe }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '저장에 실패했습니다.');
        saveStatusEl.textContent = '저장했어요!';
        loadSavedRecipes();
      } catch (err) {
        saveStatusEl.textContent = err.message;
      }
    });

    async function loadSavedRecipes() {
      const token = getToken();
      if (!token) return;
      try {
        const res = await fetch('/api/recipes/saved', {
          headers: { 'Authorization': `Bearer ${token}` },
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || '목록을 불러오지 못했습니다.');
        renderSavedRecipes(data.saved_recipes || []);
      } catch (err) {
        savedRecipesListEl.textContent = err.message;
      }
    }

    function renderSavedRecipes(recipes) {
      savedRecipesListEl.innerHTML = '';
      if (recipes.length === 0) {
        savedRecipesListEl.textContent = '아직 저장한 레시피가 없어요.';
        return;
      }
      recipes.forEach((recipe) => {
        const item = document.createElement('div');
        item.className = 'saved-recipe-item';
        const title = document.createElement('span');
        title.textContent = recipe.title;
        title.onclick = () => showRecipeDetail(recipe);
        const deleteBtn = document.createElement('button');
        deleteBtn.textContent = '삭제';
        deleteBtn.onclick = async () => {
          const token = getToken();
          await fetch(`/api/recipes/saved/${recipe.id}`, {
            method: 'DELETE',
            headers: { 'Authorization': `Bearer ${token}` },
          });
          loadSavedRecipes();
        };
        item.appendChild(title);
        item.appendChild(deleteBtn);
        savedRecipesListEl.appendChild(item);
      });
    }

    renderAuthState();
    loadSavedRecipes();
  </script>
</body>
</html>
