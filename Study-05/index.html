<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>오늘의 마음 - AI 공감 다이어리</title>
<style>
  :root {
    --cream-bg: #fdf6ec;
    --card-bg: #fffaf2;
    --accent: #f4a896;
    --accent-dark: #e08b76;
    --text-main: #5a4a3f;
    --text-sub: #9a8778;
    --border-soft: #f0e2d0;
    --shadow-soft: 0 4px 18px rgba(180, 140, 100, 0.12);
    --error-bg: #fdeaea;
    --error-text: #a3413a;
  }

  * {
    box-sizing: border-box;
  }

  html, body {
    margin: 0;
    padding: 0;
  }

  body {
    background: linear-gradient(180deg, #fdf6ec 0%, #faf0e1 100%);
    font-family: "Apple SD Gothic Neo", "Malgun Gothic", "맑은 고딕", -apple-system,
      BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px 60px;
  }

  .app {
    width: 100%;
    max-width: 560px;
  }

  header.app-header {
    text-align: center;
    margin-bottom: 28px;
  }

  header.app-header h1 {
    font-size: 1.9rem;
    margin: 0 0 8px;
    color: var(--text-main);
    letter-spacing: -0.02em;
  }

  header.app-header p {
    margin: 0;
    color: var(--text-sub);
    font-size: 0.95rem;
    line-height: 1.5;
  }

  .card {
    background: var(--card-bg);
    border-radius: 20px;
    box-shadow: var(--shadow-soft);
    padding: 22px 20px;
    margin-bottom: 22px;
    border: 1px solid var(--border-soft);
  }

  .entry-form label {
    display: block;
    font-size: 1.02rem;
    font-weight: 600;
    margin-bottom: 12px;
    color: var(--text-main);
  }

  .entry-form textarea {
    width: 100%;
    resize: none;
    border: 1px solid var(--border-soft);
    border-radius: 14px;
    padding: 12px 14px;
    font-size: 1rem;
    font-family: inherit;
    color: var(--text-main);
    background: #fffdf9;
    min-height: 56px;
    line-height: 1.5;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  .entry-form textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(244, 168, 150, 0.25);
  }

  .form-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    gap: 12px;
    flex-wrap: wrap;
  }

  .hint {
    font-size: 0.82rem;
    color: var(--text-sub);
  }

  button.submit-btn {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 10px 24px;
    font-size: 0.98rem;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s ease, transform 0.1s ease;
    white-space: nowrap;
  }

  button.submit-btn:hover:not(:disabled) {
    background: var(--accent-dark);
  }

  button.submit-btn:active:not(:disabled) {
    transform: scale(0.97);
  }

  button.submit-btn:disabled {
    background: #e6d8ca;
    cursor: not-allowed;
  }

  .form-message {
    margin-top: 10px;
    font-size: 0.86rem;
    color: var(--error-text);
    min-height: 1.2em;
  }

  .status-area {
    text-align: center;
    padding: 20px 10px;
  }

  .status-area.hidden,
  .result-card.hidden,
  .error-card.hidden {
    display: none;
  }

  .spinner {
    width: 30px;
    height: 30px;
    border: 3px solid var(--border-soft);
    border-top-color: var(--accent);
    border-radius: 50%;
    margin: 0 auto 10px;
    animation: spin 0.8s linear infinite;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  .status-area p {
    margin: 0;
    color: var(--text-sub);
    font-size: 0.9rem;
  }

  .result-card {
    text-align: center;
  }

  .result-emoji {
    font-size: 2.6rem;
    line-height: 1;
    margin-bottom: 8px;
  }

  .result-emotion {
    display: inline-block;
    background: #fbe4d8;
    color: var(--accent-dark);
    font-weight: 700;
    font-size: 0.92rem;
    padding: 4px 14px;
    border-radius: 999px;
    margin-bottom: 14px;
  }

  .result-message {
    font-size: 1.02rem;
    line-height: 1.7;
    color: var(--text-main);
    white-space: pre-wrap;
    word-break: break-word;
  }

  .error-card {
    background: var(--error-bg);
    border: 1px solid #f3caca;
    color: var(--error-text);
    border-radius: 16px;
    padding: 16px;
    font-size: 0.92rem;
    text-align: center;
    line-height: 1.5;
  }

  .history-section h2 {
    font-size: 1.1rem;
    margin: 0 0 14px;
    color: var(--text-main);
  }

  .history-empty {
    color: var(--text-sub);
    font-size: 0.9rem;
    text-align: center;
    padding: 10px 0;
  }

  ul.history-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .history-item {
    background: #fffdf9;
    border: 1px solid var(--border-soft);
    border-radius: 16px;
    padding: 14px 16px;
    position: relative;
  }

  .history-item .history-top {
    display: flex;
    flex-wrap: wrap;
    justify-content: space-between;
    align-items: flex-start;
    gap: 6px 10px;
    margin-bottom: 6px;
  }

  .history-item .history-meta {
    font-size: 0.78rem;
    color: var(--text-sub);
  }

  .history-item .history-emotion {
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--accent-dark);
  }

  .history-item .history-text {
    font-size: 0.95rem;
    color: var(--text-main);
    margin: 6px 0;
    word-break: break-word;
  }

  .history-item .history-message {
    font-size: 0.88rem;
    color: var(--text-sub);
    line-height: 1.5;
    word-break: break-word;
  }

  .delete-btn {
    background: none;
    border: none;
    color: var(--text-sub);
    font-size: 0.78rem;
    cursor: pointer;
    padding: 4px 8px;
    border-radius: 8px;
    flex-shrink: 0;
  }

  .delete-btn:hover {
    background: #f5e6d8;
    color: var(--error-text);
  }

  .delete-btn:focus-visible,
  button.submit-btn:focus-visible,
  .entry-form textarea:focus-visible {
    outline: 2px solid var(--accent-dark);
    outline-offset: 2px;
  }

  @media (max-width: 380px) {
    header.app-header h1 {
      font-size: 1.6rem;
    }
    .card {
      padding: 16px 14px;
    }
    .form-footer {
      flex-direction: column;
      align-items: stretch;
    }
    button.submit-btn {
      width: 100%;
    }
  }
</style>
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>오늘의 마음</h1>
      <p>하루 한 줄, 오늘의 감정을 기록해보세요.<br />AI가 조용히 곁에서 공감해드릴게요.</p>
    </header>

    <section class="card">
      <form class="entry-form" id="entry-form" novalidate>
        <label for="entry-text">오늘 하루는 어땠나요?</label>
        <textarea
          id="entry-text"
          rows="2"
          maxlength="300"
          placeholder="예) 오늘 발표를 망쳐서 속상했어"
        ></textarea>
        <div class="form-footer">
          <span class="hint">Enter로 바로 제출할 수 있어요</span>
          <button type="submit" class="submit-btn" id="submit-btn">마음 나누기</button>
        </div>
        <p class="form-message" id="form-message" role="alert"></p>
      </form>
    </section>

    <section aria-live="polite">
      <div class="card status-area hidden" id="status-area">
        <div class="spinner" aria-hidden="true"></div>
        <p id="status-text">AI가 당신의 마음을 헤아리고 있어요...</p>
      </div>

      <div class="card result-card hidden" id="result-card">
        <div class="result-emoji" id="result-emoji"></div>
        <div class="result-emotion" id="result-emotion"></div>
        <p class="result-message" id="result-message"></p>
      </div>

      <div class="card error-card hidden" id="error-card"></div>
    </section>

    <section class="card history-section">
      <h2>지난 기록</h2>
      <p class="history-empty" id="history-empty">아직 기록이 없어요. 첫 마음을 남겨보세요.</p>
      <ul class="history-list" id="history-list"></ul>
    </section>
  </div>

  <script>
    (function () {
      "use strict";

      // ------------------------------------------------------------------
      // OpenRouter API 키: 커밋된 버전에는 값을 넣지 않는다(git 히스토리에 시크릿이
      // 영구히 남는 것을 방지하기 위함). 실제로 사용하려면 이 폴더의 .env에 있는
      // OPENROUTER_API_KEY 값을 아래 큰따옴표 사이에 붙여넣은 뒤 로컬에서만 사용할 것.
      // ------------------------------------------------------------------
      const OPENROUTER_API_KEY = "";

      const STORAGE_KEY = "aiEmpathyDiaryEntries";
      const OPENROUTER_MODEL = "nex-agi/nex-n2.5-pro:free";
      const DIARY_MAX_LENGTH = 300;

      // ------------------------------------------------------------------
      // analyzeDiaryEntry(text, apiKey)
      //
      // 계약:
      // - 입력: text (string, 한 줄 일기), apiKey (string)
      // - 성공 시 반환: { emotion: string, emoji: string, message: string } (Promise)
      // - 실패 시: Error를 throw (에러 메시지는 한국어 친화적 문구)
      //
      // OpenRouter 무료 모델을 호출해 감정을 분석하고 공감 메시지를 생성한다.
      // 무료 모델 특성상 응답이 10~40초 정도 걸릴 수 있다.
      // ------------------------------------------------------------------
      async function analyzeDiaryEntry(text, apiKey) {
        if (!text || !text.trim()) {
          throw new Error("일기 내용이 비어있어요. 오늘의 마음을 한 줄 적어주세요.");
        }
        const trimmed = text.trim();
        if (trimmed.length > DIARY_MAX_LENGTH) {
          throw new Error(
            `입력이 너무 깁니다. ${DIARY_MAX_LENGTH}자 이내로 작성해 주세요. (현재 ${trimmed.length}자)`
          );
        }
        if (!apiKey) {
          throw new Error("API 키가 설정되지 않았습니다.");
        }

        const systemPrompt = [
          "당신은 사용자의 하루를 기록한 짧은 일기에 공감하는 다정한 AI 상담사입니다.",
          "사용자가 오늘 겪은 일을 한 줄로 적었습니다. 그 글에서 드러나는 감정을 분석하고,",
          "그 감정에 진심으로 공감하며 따뜻하게 위로하거나 함께 기뻐하는 응답을 한국어로 작성하세요.",
          "",
          "반드시 아래 JSON 형식으로만 응답하세요. 다른 설명, 인사말, 코드블록 표시(```) 없이 순수 JSON 객체 하나만 출력합니다.",
          '{"emotion": "감정을 한 단어 또는 짧은 구로 (예: 기쁨, 슬픔, 분노, 지침, 뿌듯함)", "emoji": "감정을 나타내는 이모지 1개", "message": "공감과 위로를 담은 한국어 메시지 (2~3문장)"}',
        ].join("\n");

        let response;
        try {
          const controller = new AbortController();
          const timeoutId = setTimeout(() => controller.abort(), 45000);
          try {
            response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: `Bearer ${apiKey}`,
                "HTTP-Referer": "https://study-05.local",
                "X-Title": "AI Empathy Diary",
              },
              body: JSON.stringify({
                model: OPENROUTER_MODEL,
                messages: [
                  { role: "system", content: systemPrompt },
                  { role: "user", content: trimmed },
                ],
                temperature: 0.7,
                max_tokens: 400,
                response_format: { type: "json_object" },
              }),
              signal: controller.signal,
            });
          } finally {
            clearTimeout(timeoutId);
          }
        } catch (err) {
          if (err && err.name === "AbortError") {
            throw new Error("응답 시간이 초과되었습니다. 잠시 후 다시 시도해 주세요.");
          }
          throw new Error("네트워크 연결을 확인해 주세요.");
        }

        if (!response.ok) {
          if (response.status === 401) {
            throw new Error("API 키가 유효하지 않습니다.");
          }
          if (response.status === 429) {
            throw new Error("요청이 많아 잠시 지연되고 있어요. 잠시 후 다시 시도해 주세요.");
          }
          if (response.status >= 500) {
            throw new Error("AI 서버에 일시적인 문제가 발생했습니다. 잠시 후 다시 시도해 주세요.");
          }
          throw new Error(`요청 처리 중 오류가 발생했습니다. (status ${response.status})`);
        }

        let data;
        try {
          data = await response.json();
        } catch (err) {
          throw new Error("서버 응답을 해석할 수 없습니다.");
        }

        const content =
          data && data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
        if (typeof content !== "string" || content.trim().length === 0) {
          throw new Error("AI로부터 응답을 받지 못했습니다.");
        }

        const parsed = parseModelJson(content);
        if (parsed) {
          return {
            emotion: typeof parsed.emotion === "string" ? parsed.emotion : "알 수 없음",
            emoji: typeof parsed.emoji === "string" ? parsed.emoji : "",
            message: typeof parsed.message === "string" ? parsed.message : content.trim(),
          };
        }

        return { emotion: "알 수 없음", emoji: "", message: content.trim() };
      }

      /** 모델 응답 문자열에서 JSON 객체를 견고하게 추출한다. 실패 시 null. */
      function parseModelJson(content) {
        let text = content.trim();
        const fenceMatch = text.match(/```(?:json)?\s*([\s\S]*?)```/i);
        if (fenceMatch) {
          text = fenceMatch[1].trim();
        }
        try {
          return JSON.parse(text);
        } catch (_) {}

        const braceMatch = text.match(/\{[\s\S]*\}/);
        if (braceMatch) {
          try {
            return JSON.parse(braceMatch[0]);
          } catch (_) {}
        }
        return null;
      }

      // ------------------------------------------------------------------
      // DOM 참조
      // ------------------------------------------------------------------
      const form = document.getElementById("entry-form");
      const textarea = document.getElementById("entry-text");
      const submitBtn = document.getElementById("submit-btn");
      const formMessage = document.getElementById("form-message");

      const statusArea = document.getElementById("status-area");
      const statusText = document.getElementById("status-text");
      const resultCard = document.getElementById("result-card");
      const errorCard = document.getElementById("error-card");

      const resultEmoji = document.getElementById("result-emoji");
      const resultEmotion = document.getElementById("result-emotion");
      const resultMessage = document.getElementById("result-message");

      const historyList = document.getElementById("history-list");
      const historyEmpty = document.getElementById("history-empty");

      // ------------------------------------------------------------------
      // localStorage 유틸
      // ------------------------------------------------------------------
      function loadEntries() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return [];
          const parsed = JSON.parse(raw);
          return Array.isArray(parsed) ? parsed : [];
        } catch (e) {
          return [];
        }
      }

      function saveEntries(entries) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
        } catch (e) {
          // localStorage 사용 불가 시 조용히 무시 (예: 저장공간 초과, 프라이빗 모드)
        }
      }

      function formatTimestamp(iso) {
        const d = new Date(iso);
        if (isNaN(d.getTime())) return "";
        const y = d.getFullYear();
        const m = String(d.getMonth() + 1).padStart(2, "0");
        const day = String(d.getDate()).padStart(2, "0");
        const hh = String(d.getHours()).padStart(2, "0");
        const mm = String(d.getMinutes()).padStart(2, "0");
        return `${y}.${m}.${day} ${hh}:${mm}`;
      }

      // ------------------------------------------------------------------
      // 렌더링 (textContent만 사용 - XSS 방지)
      // ------------------------------------------------------------------
      function renderHistory() {
        const entries = loadEntries();
        historyList.textContent = "";

        if (entries.length === 0) {
          historyEmpty.style.display = "block";
          return;
        }
        historyEmpty.style.display = "none";

        entries
          .slice()
          .reverse()
          .forEach((entry) => {
            const li = document.createElement("li");
            li.className = "history-item";

            const top = document.createElement("div");
            top.className = "history-top";

            const meta = document.createElement("span");
            meta.className = "history-meta";
            meta.textContent = formatTimestamp(entry.timestamp);

            const emotionSpan = document.createElement("span");
            emotionSpan.className = "history-emotion";
            emotionSpan.textContent = `${entry.emoji || ""} ${entry.emotion || ""}`.trim();

            top.appendChild(meta);
            top.appendChild(emotionSpan);

            const textP = document.createElement("p");
            textP.className = "history-text";
            textP.textContent = entry.text || "";

            const msgP = document.createElement("p");
            msgP.className = "history-message";
            msgP.textContent = entry.message || "";

            const deleteBtn = document.createElement("button");
            deleteBtn.type = "button";
            deleteBtn.className = "delete-btn";
            deleteBtn.textContent = "삭제";
            deleteBtn.setAttribute("aria-label", "이 기록 삭제");
            deleteBtn.addEventListener("click", () => {
              deleteEntry(entry.id);
            });

            li.appendChild(top);
            li.appendChild(textP);
            li.appendChild(msgP);
            li.appendChild(deleteBtn);

            historyList.appendChild(li);
          });
      }

      function deleteEntry(id) {
        const entries = loadEntries().filter((e) => e.id !== id);
        saveEntries(entries);
        renderHistory();
      }

      function addEntry(text, result) {
        const entries = loadEntries();
        entries.push({
          id: `${Date.now()}-${Math.random().toString(36).slice(2, 9)}`,
          timestamp: new Date().toISOString(),
          text: text,
          emotion: result.emotion,
          emoji: result.emoji,
          message: result.message,
        });
        saveEntries(entries);
        renderHistory();
      }

      // ------------------------------------------------------------------
      // 상태 전환
      // ------------------------------------------------------------------
      function showStatus() {
        statusArea.classList.remove("hidden");
        resultCard.classList.add("hidden");
        errorCard.classList.add("hidden");
        // aria-live 영역이 display 토글만으로는 알림을 놓칠 수 있어 텍스트를 다시 설정해 강제로 변경을 감지시킨다.
        statusText.textContent = "AI가 당신의 마음을 헤아리고 있어요...";
      }

      function showResult(result) {
        statusArea.classList.add("hidden");
        errorCard.classList.add("hidden");
        resultCard.classList.remove("hidden");

        resultEmoji.textContent = result.emoji || "";
        resultEmotion.textContent = result.emotion || "";
        resultMessage.textContent = result.message || "";
      }

      function showError(message) {
        statusArea.classList.add("hidden");
        resultCard.classList.add("hidden");
        errorCard.classList.remove("hidden");
        errorCard.textContent = message;
      }

      function clearFormMessage() {
        formMessage.textContent = "";
      }

      // ------------------------------------------------------------------
      // 제출 처리
      // ------------------------------------------------------------------
      async function handleSubmit(event) {
        event.preventDefault();
        clearFormMessage();

        const text = textarea.value.trim();
        if (!text) {
          formMessage.textContent = "오늘의 마음을 한 줄이라도 적어주세요.";
          textarea.focus();
          return;
        }

        submitBtn.disabled = true;
        textarea.disabled = true;
        showStatus();

        try {
          const result = await analyzeDiaryEntry(text, OPENROUTER_API_KEY);
          showResult(result);
          addEntry(text, result);
          textarea.value = "";
        } catch (err) {
          const message =
            err && err.message
              ? err.message
              : "마음을 분석하는 중에 문제가 생겼어요. 잠시 후 다시 시도해주세요.";
          showError(message);
        } finally {
          submitBtn.disabled = false;
          textarea.disabled = false;
        }
      }

      form.addEventListener("submit", handleSubmit);

      textarea.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          form.requestSubmit();
        }
      });

      // ------------------------------------------------------------------
      // 초기화
      // ------------------------------------------------------------------
      renderHistory();
    })();
  </script>
</body>
</html>
